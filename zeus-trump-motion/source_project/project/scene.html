<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Thunder God Rig</title>
<style>html,body{margin:0;padding:0;background:#000;overflow:hidden}#stage{width:720px;height:1800px}</style>
</head>
<body>
<div id="stage"></div>
<script src="motion.js"></script>
<script src="rig.js"></script>
<script src="scene.js"></script>
<script>
  const q = new URLSearchParams(location.search);
  const st = ThunderScene.mount(document.getElementById('stage'), {
    mode: q.get('mode') || 'full', skeleton: q.get('skel') === '1', width: 720, height: 1800 });
  window.__setFrame = (f) => ThunderScene.frame(st, f);
  window.__setFrame(+(q.get('f') || 0));
  window.__ready = true;
</script>
</body>
</html>
